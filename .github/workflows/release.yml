name: Release build

# Builds when a release is published on GitHub. It can also be started by hand from the Actions tab
# (Run workflow): that run keeps the zip as a workflow artifact instead of attaching it to a release.
# Nothing builds on ordinary pushes or pull requests.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version label for the zip name (manual runs only)"
        required: false
        default: "manual-test"

permissions:
  contents: write   # to attach the zip to a release

jobs:
  build:
    runs-on: windows-latest
    env:
      # the release's tag, or the label typed into a manual run
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || 'manual-test' }}
    steps:
      - name: Check out (with the platform submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --target FH2NoPause

      # The platform needs llvm-mingw (its __try/__except doesn't build with MSVC), so it is built on its own.
      # Only DWrite.dll is shipped: Azimuth 1.0.3 loads that and not d3dcompiler_47.dll.
      - name: Build the platform's DWrite.dll (llvm-mingw)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo mstorsjo/llvm-mingw --pattern 'llvm-mingw-*-ucrt-x86_64.zip' --dir "$env:RUNNER_TEMP"
          Expand-Archive "$env:RUNNER_TEMP/llvm-mingw-*-ucrt-x86_64.zip" -DestinationPath "$env:RUNNER_TEMP/llvm-mingw"
          $bin = (Get-ChildItem "$env:RUNNER_TEMP/llvm-mingw" -Directory | Select-Object -First 1).FullName + "/bin"
          $env:PATH = "$bin;$env:PATH"
          cmake -S platform -B build-platform -G Ninja -DCMAKE_TOOLCHAIN_FILE="$PWD/platform/cmake/mingw-w64-x86_64.cmake" -DCMAKE_BUILD_TYPE=Release
          cmake --build build-platform --target fh2mod_platform

      - name: Package
        shell: pwsh
        run: |
          $safe  = $env:RELEASE_TAG -replace '[^A-Za-z0-9._-]', '-'
          $name  = "FH2NoPause-$safe"
          $stage = "release/$name"
          New-Item -ItemType Directory -Force -Path "$stage/azimuth-windows/fh2-mods" | Out-Null
          Copy-Item build/Release/FH2NoPause.dll "$stage/azimuth-windows/fh2-mods/"
          Copy-Item build-platform/DWrite.dll "$stage/azimuth-windows/"
          Copy-Item platform/third_party/minhook/LICENSE.txt "$stage/LICENSE-MinHook.txt"
          Copy-Item README.md $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "release/$name.zip" -Force

      - name: Attach the zip to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $safe = $env:RELEASE_TAG -replace '[^A-Za-z0-9._-]', '-'
          gh release upload "$env:RELEASE_TAG" "release/FH2NoPause-$safe.zip" --clobber

      - name: Keep the zip as a workflow artifact (manual runs)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: FH2NoPause-manual-build-${{ github.run_number }}
          path: release/FH2NoPause-*.zip
          if-no-files-found: error
          retention-days: 14
